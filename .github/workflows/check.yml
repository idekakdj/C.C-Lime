name: Check C.C. Lime
on: [push, pull_request]
permissions:
  contents: read
jobs:
  windows:
    # Keep native builds on a known Visual Studio 2022 image.
    # Moving the runner/compiler is a separate compatibility change.
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
      - run: npm ci
      - name: Report dependencies (preview evidence; not production approval)
        run: npm run security:report
      - name: Retain dependency evidence
        uses: actions/upload-artifact@v4
        with:
          name: dependency-evidence
          path: test-results/supply-chain
          if-no-files-found: error
          retention-days: 14
      - run: npm run check
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm run test:cloud
      - run: npm run make
      - run: node scripts/check-package.mjs
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: desktop-test-results
          path: test-results
