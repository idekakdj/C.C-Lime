name: Check C.C. Lime
on: [push, pull_request]
jobs:
  windows:
    # The pinned Electron native builder supports Visual Studio 2022 (v143).
    # windows-latest can move to a newer, incompatible Visual Studio major.
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.13.0'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run package
      - run: node scripts/check-package.mjs
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: desktop-test-results
          path: test-results
