name: Check C.C. Lime
on: [push, pull_request]
permissions:
  contents: read
jobs:
  passkey-gateway:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          allow-unsafe-pr-checkout: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: gateway/package-lock.json
      - name: Install browser test harness without native build scripts
        run: npm ci --ignore-scripts
      - run: npm ci --ignore-scripts
        working-directory: gateway
      - run: npm audit --audit-level=moderate
        working-directory: gateway
      - run: npm run check:syntax
        working-directory: gateway
      - run: npm run build
        working-directory: gateway
      - run: npm test
        working-directory: gateway
  windows:
    # Keep native builds on a known Visual Studio 2022 image.
    # Moving the runner/compiler is a separate compatibility change.
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          allow-unsafe-pr-checkout: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
          cache: npm
      - run: npm ci
      - name: Check dependencies (npm gate; not production approval)
        run: npm run check:release-security
      - name: Retain dependency evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          archive: true
          name: dependency-evidence
          path: test-results/supply-chain
          if-no-files-found: error
          retention-days: 14
      - run: npm run check
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - run: npm run test:cloud
      - run: npm run make
      - name: Verify installer notice content
        run: pwsh -NoProfile -File scripts/check-installer-notices.ps1
      - name: Retain installer notice evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          archive: true
          name: installer-notice-evidence
          path: test-results/installer-notices/summary.json
          if-no-files-found: warn
          retention-days: 14
      - run: node scripts/check-package.mjs
      - name: Inspect native package (inventory, not production approval)
        run: node scripts/inspect-native-package.mjs
      - name: Retain native package evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          archive: true
          name: native-package-evidence
          path: test-results/native-package/summary.json
          if-no-files-found: warn
          retention-days: 14
      - run: npm run test:e2e
      - name: Independent renderer acceptance with Node CLI inspection disabled
        run: node node_modules/@playwright/test/cli.js test --config playwright.production.config.ts
      - name: Retain independent renderer evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          archive: true
          name: independent-renderer-evidence
          path: test-results/production-artifacts/**/summary.json
          if-no-files-found: warn
          retention-days: 14
      - name: Renderer compatibility with all seven fuses on disposable copies
        env:
          CC_LIME_ACCEPTANCE_FUSES: all-seven
        run: node node_modules/@playwright/test/cli.js test --config playwright.production.config.ts appearance.spec.ts calendar.spec.ts courses.spec.ts password-form.spec.ts recurrence.spec.ts renderer.spec.ts frame-boundaries.spec.ts signin-readiness.spec.ts mfa-readiness.spec.ts task-ranges.spec.ts tasks.spec.ts --output test-results/hardened-renderer-artifacts
      - name: Retain combined fuse renderer evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          archive: true
          name: hardened-renderer-evidence
          path: test-results/hardened-renderer-artifacts/**/summary.json
          if-no-files-found: warn
          retention-days: 14
      - name: Retain synthetic recovery evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          archive: true
          name: recovery-evidence
          path: test-results/e2e-artifacts/**/recovery-summary.json
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          archive: true
          name: desktop-test-results
          path: |
            test-results/**
            !test-results/production-acceptance/**
            !test-results/fuse-transport/**
